apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app: {{ .Release.Name }}-app
  annotations:
    description: {{- include "release.description" . }} 
    # "." current context
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-app
    spec:
      {{- include "release.imagePullSecrets" . | nindent 6}}
      containers:
      - name: app-container
        # Limit the scope
        {{- with .Values.image }}
        image: "{{ .repository }}:{{ .tag }}"
        imagePullPolicy: {{ .pullPolicy }}
        {{- end }}
        env:
        - name: DB_URL
          value: {{ include "release.dbUrl" (dict "db" .Values.appEnv.DB_NAME "context" .) | quote }}
          # Pass a dict:
          # 2 items
          # "db": .Values.appEnv.DB_NAME
          # "context": .
